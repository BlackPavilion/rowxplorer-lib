[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rowxplorer-lib"
version = "0.1.0"
description = "Control Rowenta X-Plorer 45 (and other Groupe SEB) robot vacuums from Python"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "BlackPavilion" }]
keywords = ["rowxplorer-lib", "robot", "vacuum", "x-plorer", "iot", "seb", "mqtt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Home Automation",
]
dependencies = [
    "requests>=2.28",
    "paho-mqtt>=2.0",
    "websocket-client>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff"]

[project.scripts]
rowxplorer-lib = "rowxplorer_lib.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
